# Chinese (zh-CN) translation of the service's OpenAPI document, as an OpenAPI Overlay.
# Each action replaces summary/description at `target`; `x-source` is the English it
# translates. When the English changes, tests report the action as stale.
overlay: 1.0.0
info:
  title: FrontierAgent service API, zh-CN
  version: 1.0.0
actions:
- target: $.info
  update:
    description: |
      异步运行 FrontierAgent 任务。

      提交任务后，可通过 Server-Sent Events（SSE）实时接收进度，或轮询任务状态。任务进入终态后，读取结果并下载它生成的文件。

      **生命周期：** `queued` → `running` → `completed` | `failed` | `cancelled` | `timed_out`。`cancelling` 是发起取消到工作进程退出之间的过渡状态。

      **鉴权：** 服务配置了 API token 时，所有 `/v1` 接口都需要携带 `Authorization: Bearer <token>`。
  x-source:
    description: |
      Run FrontierAgent tasks asynchronously.

      Submit a task, then follow its progress over Server-Sent Events or poll its
      status. When it reaches a final status, read the answer and download the
      files it produced.

      **Lifecycle:** `queued` → `running` → `completed` | `failed` | `cancelled` | `timed_out`.
      `cancelling` is the transient state between a cancel request and the worker
      exiting.

      **Authentication:** when the service is configured with an API token, every
      `/v1` endpoint requires `Authorization: Bearer <token>`.
