# GitLab manages merge requests; Jenkins builds and deploys. This pipeline only
# gates merges. The API docs are generated from the code and served by each
# deployed service at /docs, so a release needs no docs step.

stages:
  - check

# Every endpoint and field is documented, and the Chinese translation is
# complete and matches the current English (see AGENTS.md). On failure the job
# log prints the overlay actions to paste into agent_service/openapi/zh-CN.yaml.
api-docs:
  stage: check
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  script:
    - uv sync --locked --extra dev --extra service
    - uv run pytest -q tests/test_agent_service.py tests/test_agent_service_docs.py
